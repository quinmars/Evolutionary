name: Documentation

# Every push to master rebuilds the documentation and publishes it to
# GitHub Pages.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Once a Pages deployment has started it must not be cancelled, otherwise
# the deployment could end up in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history for the docfx git features (contributors, view
          # source links).
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically enable the Pages site if it does not exist yet.
          enablement: true

      - name: Restore the local docfx tool
        run: dotnet tool restore

      - name: Build the documentation
        run: dotnet docfx doc/docfx.json

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

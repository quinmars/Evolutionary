name: Unit Tests

on: [pull_request, push]

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Exclude windows only examples
      run: dotnet sln Evolutionary.slnx remove examples/EightQueens/EightQueens.csproj
    - name: Build with dotnet
      run: dotnet build Evolutionary.slnx --configuration Release
    - name: Run unit tests
      run: dotnet test Evolutionary.slnx

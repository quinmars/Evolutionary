name: NuGet

# Pushing a v* tag (e.g. v1.0.0) builds and publishes the package to
# nuget.org and creates a GitHub release.
on:
  push:
    tags: ['v*']

# Minimal privileges for the GITHUB_TOKEN. The NuGet publishing uses
# trusted publishing: a short-lived GitHub OIDC token (id-token: write)
# is exchanged for a temporary API key, so no secret is stored at all.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Fail early if the version in the csproj and the tag diverge.
      - name: Verify the tag matches the package version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Evolutionary/Evolutionary.csproj)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::The tag '${{ github.ref_name }}' does not match the package version '$version' in Evolutionary/Evolutionary.csproj"
            exit 1
          fi

      - name: Build and pack the NuGet package
        run: dotnet pack Evolutionary/Evolutionary.csproj --configuration Release --output artifacts

      # Trusted publishing: exchanges a short-lived GitHub OIDC token for
      # a temporary NuGet API key (valid for 1 hour). The trust policy on
      # nuget.org pins this to this repository and this workflow file, so
      # no long-lived secret is needed.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # Your nuget.org profile name (not your email address).
          user: quinmars

      # The corresponding snupkg symbol package is pushed automatically.
      - name: Push the package to nuget.org
        run: dotnet nuget push artifacts/Evolutionary.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create a GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/Evolutionary.*.nupkg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Evolutionary – Darwinfink (Skizze)">
  <defs>
    <linearGradient id="paper2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2E8"/>
      <stop offset="1" stop-color="#E9E0CE"/>
    </linearGradient>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.13" numOctaves="3" seed="5" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="3.5"/>
    </filter>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#paper2)"/>

  <!-- Schmiererei -->
  <g filter="url(#soft3)" opacity="0.4">
    <path d="M14 112 Q44 104 74 110" stroke="#8A7E68" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <g filter="url(#rough2)" stroke="#2A2521" fill="none" stroke-linecap="round">
    <!-- Konstruktionslinien -->
    <circle cx="47" cy="40" r="13.5" stroke-width="2.2"/>
    <ellipse cx="65" cy="59" rx="24" ry="15" transform="rotate(-18 65 59)" stroke-width="2.4"/>
    <path d="M84 48 L108 40 L88 62 Z" stroke-width="2.2"/>
    <path d="M40 37 L25 46 L41 54 Z" stroke-width="2.2"/>
    <!-- Ast und Beine -->
    <path d="M20 101 C44 96 76 101 100 97" stroke-width="4"/>
    <path d="M63 72 L61 95 M71 74 L73 96" stroke-width="2"/>
    <!-- Schraffur auf dem Gefieder -->
    <path d="M50 56 L62 66 M56 52 L68 64 M62 50 L74 60 M68 50 L78 57" stroke-width="1.6" opacity="0.6"/>
    <!-- lose Kritzelstriche -->
    <path d="M36 26 Q48 18 62 24" stroke-width="1.8" opacity="0.5"/>
    <path d="M30 72 Q42 82 58 85" stroke-width="1.8" opacity="0.45"/>
  </g>

  <!-- Auge -->
  <circle cx="44" cy="38" r="2.6" fill="#2A2521"/>
  <circle cx="43.4" cy="37.4" r="0.9" fill="#F6F1E7"/>
</svg>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Evolutionary – Logo (Darwinfink, Kohle)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; padding: 24px; color: #0f172a; }
  h1 { font-size: 20px; } h2 { font-size: 14px; color: #475569; margin-top: 32px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; text-align: center; }
  .card figcaption { margin-top: 10px; font-size: 13px; color: #64748b; }
  .dark { background: #0f172a; border-radius: 12px; padding: 16px; text-align: center; }
  .dark figcaption { margin-top: 10px; font-size: 13px; color: #94a3b8; }
  img { display: block; margin: 0 auto; }
</style>
</head>
<body>
<h1>Evolutionary – Logo „Darwinfink, in Kohle“ (Variante A)</h1>

<h2>Größen (wie das Logo später erscheint)</h2>
<div class="row">
  <figure class="card">
    <img src="evolutionary-finch.svg" width="128" height="128" alt="Evolutionary Logo">
    <figcaption>128 px (NuGet-Icon, Doku-Header)</figcaption>
  </figure>
  <figure class="card">
    <img src="evolutionary-finch-64.png" width="64" height="64" alt="64 px">
    <figcaption>64 px (PNG)</figcaption>
  </figure>
  <figure class="card">
    <img src="evolutionary-finch-128.png" width="128" height="128" alt="128 px PNG">
    <figcaption>128 px (PNG)</figcaption>
  </figure>
  <figure class="dark">
    <img src="evolutionary-finch-256.png" width="128" height="128" alt="256 px PNG">
    <figcaption>256 px (PNG, dunkler Grund)</figcaption>
  </figure>
</div>

<h2>Kleinskalierung (Icon-Test – z. B. neben dem Paketnamen auf nuget.org)</h2>
<div class="row">
  <figure class="card">
    <img src="evolutionary-finch-64.png" width="48" height="48" alt="48 px">
    <figcaption>48 px</figcaption>
  </figure>
  <figure class="card">
    <img src="evolutionary-finch-64.png" width="32" height="32" alt="32 px">
    <figcaption>32 px</figcaption>
  </figure>
</div>

<h2>Alternativ-Variante (Skizze mit Schraffur)</h2>
<div class="row">
  <figure class="card">
    <img src="evolutionary-finch-sketch.svg" width="128" height="128" alt="Skizzen-Variante">
    <figcaption>B – falls doch gewünscht</figcaption>
  </figure>
</div>
</body>
</html>
